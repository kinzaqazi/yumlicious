<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumilicious - Fast Food & Pizza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .food-card:hover { transform: translateY(-5px); transition: 0.3s; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header & Logo -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="logo.png" alt="Yumilicious Logo" class="h-12 w-12 rounded-full">
                <h1 class="text-2xl font-bold text-red-600">YUMILICIOUS</h1>
            </div>
            <button onclick="toggleCart()" class="relative p-2 bg-yellow-400 rounded-full">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span id="cart-count" class="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Banner -->
    <div id="hero-banner" class="w-full h-48 md:h-64 bg-cover bg-center mb-6" style="background-image: url('banner.jpg');">
        <div class="w-full h-full bg-black/40 flex items-center justify-center">
            <h2 class="text-white text-3xl font-bold italic">Deliciously Fresh, Every Bite!</h2>
        </div>
    </div>

    <!-- Menu Section -->
    <main class="container mx-auto px-4 pb-20">
        <div id="menu-container">
            <!-- JavaScript will inject menu items here -->
            <p class="text-center">Loading Menu...</p>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-[60] p-6 overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-4 mb-4">
            <h2 class="text-2xl font-bold">Your Order</h2>
            <button onclick="toggleCart()" class="text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="space-y-4"></div>
        <div class="border-t mt-6 pt-4">
            <div class="flex justify-between text-xl font-bold mb-6">
                <span>Total:</span>
                <span>Rs. <span id="cart-total">0</span></span>
            </div>
            <input id="cust-name" type="text" placeholder="Your Name" class="w-full border p-2 mb-2 rounded">
            <textarea id="cust-address" placeholder="Delivery Address" class="w-full border p-2 mb-4 rounded"></textarea>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700">
                <i class="fa-brands fa-whatsapp mr-2"></i> Order on WhatsApp
            </button>
        </div>
    </div>

    <script>
        let menuData = {};
        let cart = [];

        // Fetch Menu from JSON
        async function loadMenu() {
            try {
                const response = await fetch('menu.json');
                menuData = await response.json();
                renderMenu();
            } catch (e) { console.error("Error loading menu", e); }
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuData.categories.map(cat => `
                <div class="mb-10">
                    <h3 class="text-2xl font-bold border-l-4 border-red-600 pl-3 mb-6">${cat.name}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${cat.items.map(item => `
                            <div class="food-card bg-white rounded-xl shadow-md overflow-hidden flex flex-col">
                                <img src="${item.image}" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/300x200?text=Yumilicious'">
                                <div class="p-4 flex-1 flex flex-col">
                                    <h4 class="font-bold text-lg">${item.name}</h4>
                                    <p class="text-gray-500 text-sm flex-1">${item.desc}</p>
                                    <div class="flex justify-between items-center mt-4">
                                        <span class="text-red-600 font-bold text-xl">Rs. ${item.price}</span>
                                        <button onclick="addToCart(${item.id}, '${item.name}', ${item.price})" class="bg-yellow-400 px-4 py-2 rounded-lg font-bold hover:bg-yellow-500">Add +</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id, name, price) {
            cart.push({id, name, price});
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between items-center border-b pb-2">
                    <div>
                        <p class="font-bold">${item.name}</p>
                        <p class="text-sm text-gray-500 font-bold">Rs. ${item.price}</p>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-500 text-sm">Remove</button>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const address = document.getElementById('cust-address').value;
            if(!name || !address || cart.length === 0) {
                alert("Please add items and fill details!");
                return;
            }

            let message = `*New Order from Website*%0A%0A`;
            message += `*Name:* ${name}%0A`;
            message += `*Address:* ${address}%0A%0A`;
            message += `*Items:*%0A`;
            cart.forEach(item => {
                message += `- ${item.name} (Rs. ${item.price})%0A`;
            });
            message += `%0A*Total: Rs. ${document.getElementById('cart-total').innerText}*`;

            const whatsappUrl = `https://wa.me/${menuData.restaurant.whatsapp}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        loadMenu();
    </script>
</body>
</html>
